name: Update feature tracking data

on:
  schedule:
    # Weekly on Mondays at 09:17 UTC.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install canitf project
        run: python -m pip install -e .

      - name: Refresh release data and feature table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          canitf fetch --per-page 100 --max-pages 3 --out data/releases.json
          canitf build-table \
            --input data/releases.json \
            --json-out data/features.json \
            --markdown-out data/feature-table.md \
            --include-canitf
          canitf generate-cdktn-source \
            --features-input data/hcl-feature-input.json \
            --generated-features data/features.json \
            --out data/cdktn-feature-constraints.ts

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Create pull request when data changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/update-feature-data
          delete-branch: true
          title: "chore: refresh Terraform/OpenTofu feature data"
          commit-message: "chore: refresh Terraform/OpenTofu feature data"
          body: |
            Weekly automated refresh of Terraform/OpenTofu release data and generated feature tracking outputs.

            Generated by `.github/workflows/update-data.yml`.
